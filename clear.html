<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>CINEMORA - Updating to v7.2</title>
<style>body{background:#050507;color:white;font-family:Inter,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;margin:0} .box{background:#0f0f17;border:1px solid #7c3aed;border-radius:20px;padding:30px;max-width:400px;width:90%} .spinner{width:40px;height:40px;border:3px solid #1e1e2a;border-top:3px solid #7c3aed;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px} @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>
</head><body>
<div class="box">
<div class="spinner"></div>
<div style="font-weight:800;font-size:18px">CINEMORA PRO v7.2</div>
<div style="font-size:12px;color:#a78bfa;margin-top:8px" id="status">Clearing old cache & fixing red X...</div>
<div style="font-size:10px;color:#555;margin-top:16px">One link = Always NEW version ✅</div>
</div>
<script>
async function forceUpdate(){
  const s=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(let r of regs){ await r.unregister(); s.textContent='Removing old service worker...'; }
    }
    if('caches' in window){
      const keys=await caches.keys();
      for(let k of keys){ await caches.delete(k); s.textContent='Deleting old: '+k; }
    }
    localStorage.setItem('cinemora_version','7.2');
    s.textContent='Loading NEW v7.2 GREEN...'; s.style.color='#22c55e';
    setTimeout(()=>{ window.location.href='./index.html?v=7.2&ts='+Date.now()+'&nocache=1'; },1200);
  }catch(e){ window.location.href='./index.html?v=7.2&force='+Date.now(); }
}
forceUpdate();
</script>
</body></html>
