<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fixing 404 - CINEMORA AI v7.5</title><style>body{background:#050507;color:white;font-family:Inter,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;margin:0}.box{background:#0f0f17;border:1px solid #7c3aed;border-radius:20px;padding:30px;max-width:400px;width:90%}.spinner{width:40px;height:40px;border:3px solid #1e1e2a;border-top:3px solid #7c3aed;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spinner"></div><div style="font-weight:800;font-size:18px">CINEMORA AI v7.5</div><div style="font-size:12px;color:#a78bfa;margin-top:8px" id="status">Fixing 404 Error...<br>Deleting old /CINEMORA-AI/ cache</div><div style="font-size:10px;color:#22c55e;margin-top:12px">Dashboard opens but others 404 → Fixed in v7.5</div></div><script>async function fix404(){const s=document.getElementById('status');try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(let r of regs){await r.unregister();s.innerHTML='Removing old service worker...<br>'+r.scope;}}if('caches' in window){const keys=await caches.keys();for(let k of keys){await caches.delete(k);s.innerHTML='Deleting cache: '+k;}}localStorage.setItem('cinemora_version','7.5');s.innerHTML='Fixed! Loading v7.5...<br>All pages will work now';s.style.color='#22c55e';setTimeout(()=>{location.href='/index.html?v=7.5&fix404='+Date.now();},1500);}catch(e){location.href='/index.html?v=7.5&force='+Date.now();}}fix404();</script></body></html>
