<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CINEMORA - My Videos</title>
<link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#7c3aed">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050507;font-family:'Inter',sans-serif;color:white;min-height:100vh;padding-bottom:90px}.container{max-width:540px;margin:0 auto;padding:16px}.header{display:flex;align-items:center;gap:12px;padding:10px 0 20px}.back{width:36px;height:36px;background:#13131a;border:1px solid #1e1e2a;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}.title{font-weight:800;font-size:18px}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}.stat{background:#0f0f17;border:1px solid #1e1e2a;border-radius:12px;padding:12px;text-align:center}.stat-num{font-size:18px;font-weight:800}.stat-label{font-size:10px;color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.video-card{background:#0f0f17;border:1px solid #1e1e2a;border-radius:14px;overflow:hidden;transition:0.2s}.video-card:hover{border-color:#7c3aed;transform:translateY(-2px)}.thumb{height:100px;background:linear-gradient(135deg,#1a102e,#2a1a4a);display:flex;align-items:center;justify-content:center;position:relative;font-size:32px}.thumb::after{content:'▶';position:absolute;width:32px;height:32px;background:rgba(0,0,0,0.6);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;backdrop-filter:blur(4px)}.info{padding:10px}.v-title{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}.v-meta{font-size:9px;color:#666;display:flex;justify-content:space-between}.empty{text-align:center;padding:60px 20px;color:#666}.empty-icon{font-size:48px;margin-bottom:12px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,15,21,0.95);backdrop-filter:blur(20px);border-top:1px solid #1e1e2a;display:flex;justify-content:space-around;padding:10px 0 14px;z-index:100}.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:#666;font-size:10px;font-weight:600;text-decoration:none;min-width:60px}.nav-item.active{color:#7c3aed}.nav-icon{font-size:20px}</style></head>
<body><div class="container"><div class="header"><div class="back" onclick="location.href='index.html'">←</div><div class="title">My Videos 🎬</div></div>
<div class="stats"><div class="stat"><div class="stat-num" id="totalVideos">0</div><div class="stat-label">Total Videos</div></div><div class="stat"><div class="stat-num">24h</div><div class="stat-label">Time Saved</div></div><div class="stat"><div class="stat-num">4K</div><div class="stat-label">Avg Quality</div></div></div>
<div class="grid" id="videoGrid"></div>
<div class="empty" id="emptyState"><div class="empty-icon">🎬</div><div style="font-weight:700;font-size:14px;margin-bottom:6px">No videos yet</div><div style="font-size:11px;color:#777;margin-bottom:16px">Generate your first AI video and it will appear here</div><button onclick="location.href='index.html'" style="background:#7c3aed;color:white;border:none;padding:10px 20px;border-radius:20px;font-weight:700;font-size:12px;cursor:pointer">✨ Create Video</button></div>
</div>
<div class="bottom-nav">
<a class="nav-item" href="index.html"><div class="nav-icon">🏠</div><div>Home</div></a>
<a class="nav-item" href="ad.html"><div class="nav-icon">🎁</div><div>Earn</div></a>
<a class="nav-item active" href="my-videos.html"><div class="nav-icon">▶️</div><div>My Videos</div></a>
<a class="nav-item" href="settings.html"><div class="nav-icon">⚙️</div><div>Settings</div></a>
</div>
<script>
function loadVideos(){
  const videos = JSON.parse(localStorage.getItem('cinemora_videos')||'[]');
  const grid = document.getElementById('videoGrid');
  const empty = document.getElementById('emptyState');
  document.getElementById('totalVideos').textContent = videos.length;
  if(videos.length===0){grid.style.display='none';empty.style.display='block';return;}
  grid.style.display='grid';empty.style.display='none';
  grid.innerHTML = videos.map((v,i)=>`
    <div class="video-card">
      <div class="thumb">${v.style==='Anime'?'🎨':v.style==='Nature'?'🏔️':v.style==='Cyberpunk'?'🌃':'🎬'}</div>
      <div class="info">
        <div class="v-title">${v.prompt.substring(0,30)}...</div>
        <div class="v-meta"><span>${v.model?.substring(0,10)||'CINEMORA'}</span><span>${v.duration||'8s'}</span></div>
        <div class="v-meta"><span style="color:#7c3aed">${v.style}</span><span>${v.time.split(',')[0]}</span></div>
      </div>
    </div>
  `).join('');
}
loadVideos();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
</script>
</body></html>
