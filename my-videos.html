<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Videos - cinemora.ai</title><link rel="manifest" href="/manifest.json?v=7.5"><meta name="theme-color" content="#7c3aed"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050507;font-family:'Inter',sans-serif;color:white;min-height:100vh;padding-bottom:90px}.container{max-width:540px;margin:0 auto;padding:16px}.header{display:flex;align-items:center;gap:12px;padding:10px 0 20px}.back{width:36px;height:36px;background:#13131a;border:1px solid #1e1e2a;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}.title{font-weight:800;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.video-card{background:#0f0f17;border:1px solid #1e1e2a;border-radius:14px;overflow:hidden}.thumb{height:100px;background:linear-gradient(135deg,#1a102e,#2a1a4a);display:flex;align-items:center;justify-content:center;font-size:32px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,15,21,0.95);backdrop-filter:blur(20px);border-top:1px solid #1e1e2a;display:flex;justify-content:space-around;padding:10px 0 14px;z-index:100}.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:#666;font-size:10px;font-weight:600;text-decoration:none;min-width:60px}.nav-item.active{color:#7c3aed}.nav-icon{font-size:20px}</style></head><body><div class="container"><div class="header"><div class="back" onclick="location.href='/index.html?v=7.5'">←</div><div class="title">My Videos 🎬</div></div><div class="grid" id="videoGrid"></div><div style="text-align:center;padding:60px 20px;color:#666" id="emptyState"><div style="font-size:48px;margin-bottom:12px">🎬</div><div style="font-weight:700;font-size:14px;margin-bottom:6px">No videos yet</div><button onclick="location.href='/index.html?v=7.5'" style="background:#7c3aed;color:white;border:none;padding:10px 20px;border-radius:20px;font-weight:700;font-size:12px;cursor:pointer">✨ Create Video</button></div></div><div class="bottom-nav"><a class="nav-item" href="/index.html?v=7.5"><div class="nav-icon">🏠</div><div>Home</div></a><a class="nav-item" href="/ad.html?v=7.5"><div class="nav-icon">🎁</div><div>Earn</div></a><a class="nav-item active" href="/my-videos.html?v=7.5"><div class="nav-icon">▶️</div><div>My Videos</div></a><a class="nav-item" href="/settings.html?v=7.5"><div class="nav-icon">⚙️</div><div>Settings</div></a></div><script>function loadVideos(){const v=JSON.parse(localStorage.getItem('cinemora_videos')||'[]');const g=document.getElementById('videoGrid');const e=document.getElementById('emptyState');if(v.length===0){g.style.display='none';e.style.display='block';return;}g.style.display='grid';e.style.display='none';g.innerHTML=v.map(x=>`<div class="video-card"><div class="thumb">🎬</div><div style="padding:10px"><div style="font-size:11px;font-weight:700">${x.prompt.substring(0,30)}...</div></div></div>`).join('');}loadVideos();if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js?v=7.5');}</script></body></html>
