<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050507;font-family:'Inter',sans-serif;color:white;min-height:100vh;padding-bottom:90px}.container{max-width:540px;margin:0 auto;padding:16px}.header{display:flex;align-items:center;gap:12px;padding:10px 0 20px}.back{width:36px;height:36px;background:#13131a;border:1px solid #1e1e2a;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}.title{font-weight:800;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.video-card{background:#0f0f17;border:1px solid #1e1e2a;border-radius:14px;overflow:hidden}.thumb{height:100px;background:linear-gradient(135deg,#1a102e,#2a1a4a);display:flex;align-items:center;justify-content:center;font-size:32px}.info{padding:10px}.v-title{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,15,21,0.95);backdrop-filter:blur(20px);border-top:1px solid #1e1e2a;display:flex;justify-content:space-around;padding:10px 0 14px;z-index:100}.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:#666;font-size:10px;font-weight:600;text-decoration:none;min-width:60px}.nav-item.active{color:#7c3aed}.nav-icon{font-size:20px}</style></head>
<body><div class="container"><div class="header"><div class="back" onclick="location.href='./index.html?v=7.1'">←</div><div class="title">My Videos 🎬</div></div>
<div class="grid" id="videoGrid"></div>
<div style="text-align:center;padding:60px 20px;color:#666" id="emptyState"><div style="font-size:48px;margin-bottom:12px">🎬</div><div style="font-weight:700;font-size:14px;margin-bottom:6px">No videos yet</div><div style="font-size:11px;color:#777;margin-bottom:16px">Generate your first AI video</div><button onclick="location.href='./index.html?v=7.1'" style="background:#7c3aed;color:white;border:none;padding:10px 20px;border-radius:20px;font-weight:700;font-size:12px;cursor:pointer">✨ Create Video</button></div>
<div style="background:#0f0f17;border:1px solid #1e1e2a;border-radius:16px;padding:16px;margin-top:16px;margin-bottom:16px"><div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap"><a href="./about.html?v=7.1" style="color:#a78bfa;text-decoration:none;font-size:11px">About</a><span style="color:#2a2a3a">•</span><a href="./contact.html?v=7.1" style="color:#a78bfa;text-decoration:none;font-size:11px">Contact</a><span style="color:#2a2a3a">•</span><a href="./privacy.html?v=7.1" style="color:#a78bfa;text-decoration:none;font-size:11px">Privacy</a><span style="color:#2a2a3a">•</span><a href="./terms.html?v=7.1" style="color:#a78bfa;text-decoration:none;font-size:11px">Terms</a></div><div style="text-align:center;margin-top:10px;font-size:9px;color:#555">CINEMORA PRO v7.1</div></div>
</div>
<div class="bottom-nav">
<a class="nav-item" href="./index.html?v=7.1"><div class="nav-icon">🏠</div><div>Home</div></a>
<a class="nav-item" href="./ad.html?v=7.1"><div class="nav-icon">🎁</div><div>Earn</div></a>

<script>
function loadVideos(){const videos=JSON.parse(localStorage.getItem('cinemora_videos')||'[]');const grid=document.getElementById('videoGrid');const empty=document.getElementById('emptyState');if(videos.length===0){grid.style.display='none';empty.style.display='block';return;}grid.style.display='grid';empty.style.display='none';grid.innerHTML=videos.map(v=>`<div class="video-card"><div class="thumb">🎬</div><div class="info"><div class="v-title">${v.prompt.substring(0,30)}...</div><div style="font-size:9px;color:#666;display:flex;justify-content:space-between"><span>${v.style}</span><span>${v.time.split(',')[0]}</span></div></div></div>`).join('');}
loadVideos();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js?v=7.1'); }
</script></body></html>
