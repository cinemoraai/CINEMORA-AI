<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CINEMORA - Login</title><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#7c3aed"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050507;font-family:'Inter',sans-serif;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 20%,rgba(124,58,237,0.15) 0%,transparent 50%),linear-gradient(to bottom,#050507 0%,#0a0a15 100%);z-index:-1}.card{max-width:420px;width:100%;background:rgba(18,18,26,0.6);border:1px solid rgba(124,58,237,0.15);border-radius:28px;padding:28px;backdrop-filter:blur(20px)}.logo-text{font-weight:900;font-size:28px;letter-spacing:2px;text-align:center;margin-bottom:2px;background:linear-gradient(135deg,white,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.logo-sub{font-size:10px;letter-spacing:8px;color:#a78bfa;text-align:center;font-weight:700;margin-bottom:20px}.tabs{display:flex;background:rgba(12,12,18,0.8);border:1px solid rgba(30,30,42,0.4);border-radius:14px;padding:4px;margin-bottom:20px}.tab{flex:1;padding:11px;border-radius:10px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;color:#777;transition:0.2s}.tab.active{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:white;box-shadow:0 2px 8px rgba(124,58,237,0.3)}.form-section{display:none}.form-section.active{display:block}.input-group{margin-bottom:16px}.input-label{font-size:11px;color:#a78bfa;font-weight:600;margin-bottom:6px;display:block}.input{width:100%;background:rgba(12,12,18,0.8);border:1px solid rgba(30,30,42,0.5);border-radius:12px;padding:14px 16px;color:white;outline:none;font-size:14px;transition:0.2s}.input:focus{border-color:#7c3aed;background:rgba(18,18,26,0.8)}.input::placeholder{color:#555}.options{display:flex;justify-content:space-between;align-items:center;margin:14px 0 20px;font-size:12px}.check{display:flex;align-items:center;gap:8px;color:#888;cursor:pointer;font-size:12px}.check-box{width:18px;height:18px;border:1.5px solid #2a2a3a;border-radius:4px;display:flex;align-items:center;justify-content:center;transition:0.2s}.check-box.checked{background:#7c3aed;border-color:#7c3aed}.check-box.checked::after{content:'✓';color:white;font-size:11px;font-weight:800}.btn{width:100%;background:linear-gradient(135deg,#7c3aed 0%,#a78bfa 100%);color:white;border:none;padding:15px;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer}.error{color:#ef4444;font-size:11px;text-align:center;margin-bottom:12px;display:none;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.15);border-radius:10px;padding:10px}.success{color:#22c55e;font-size:11px;text-align:center;margin-bottom:12px;display:none;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.15);border-radius:10px;padding:10px}.forgot-link{color:#a78bfa;cursor:pointer;font-weight:600}.password-strength{height:3px;background:#1e1e2a;border-radius:2px;margin-top:8px;overflow:hidden;display:none}.password-strength.show{display:block}.strength-bar{height:100%;width:0%;transition:0.3s}.strength-text{font-size:10px;margin-top:6px;color:#888}.terms{display:flex;align-items:flex-start;gap:10px;font-size:12px;color:#888;margin:14px 0;line-height:1.4}.terms a{color:#a78bfa;text-decoration:none;font-weight:600}.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);z-index:1000;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.modal-card{background:rgba(18,18,26,0.95);border:1px solid rgba(124,58,237,0.2);border-radius:24px;padding:24px;max-width:380px;width:100%}.footer-links{display:flex;justify-content:center;gap:16px;margin-top:20px;flex-wrap:wrap}.footer-links a{color:#666;font-size:11px;text-decoration:none}.footer-links a:hover{color:#a78bfa}</style></head><body><div class="card"><div class="logo-text">CINEMORA</div><div class="logo-sub">AI</div><div class="tabs"><div class="tab active" id="loginTab" onclick="switchTab('login')">Login</div><div class="tab" id="signupTab" onclick="switchTab('signup')">Create Account</div></div><div class="error" id="error"></div><div class="success" id="success"></div><div class="form-section active" id="loginForm"><div class="input-group"><div class="input-label">Email Address</div><input class="input" id="loginEmail" type="email" placeholder="you@example.com"></div><div class="input-group"><div class="input-label">Password</div><input class="input" id="loginPassword" type="password" placeholder="Enter your password"></div><div class="options"><div class="check" onclick="this.querySelector('.check-box').classList.toggle('checked')"><div class="check-box checked"></div><span>Keep me signed in</span></div><div class="forgot-link" onclick="openForgot()">Forgot password?</div></div><button class="btn" id="loginBtn">Log In</button></div><div class="form-section" id="signupForm"><div class="input-group"><div class="input-label">Full Name</div><input class="input" id="signupName" type="text" placeholder="Your full name"></div><div class="input-group"><div class="input-label">Email Address</div><input class="input" id="signupEmail" type="email" placeholder="you@example.com"></div><div class="input-group"><div class="input-label">Password</div><input class="input" id="signupPassword" type="password" placeholder="Create a password" oninput="checkStrength(this.value)"><div class="password-strength" id="strengthBar"><div class="strength-bar" id="strengthFill"></div></div><div class="strength-text" id="strengthText"></div></div><div class="input-group"><div class="input-label">Confirm Password</div><input class="input" id="signupConfirm" type="password" placeholder="Confirm your password"></div><div class="terms"><div class="check-box" id="termsBox" onclick="this.classList.toggle('checked')"></div><div>I agree to <a href="./terms.html">Terms</a> and <a href="./privacy.html">Privacy Policy</a></div></div><button class="btn" id="createBtn">Create Account • 850 Credits Free</button></div><div class="footer-links"><a href="./about.html">About</a><a href="./contact.html">Contact</a><a href="./privacy.html">Privacy</a><a href="./terms.html">Terms</a></div></div><div class="modal" id="forgotModal" onclick="if(event.target===this)closeForgot()"><div class="modal-card"><div style="text-align:center;margin-bottom:20px"><div style="font-weight:800;font-size:18px;color:white">Reset Password</div><div style="font-size:12px;color:#888;margin-top:8px">Enter your email to receive a reset link</div></div><div class="error" id="forgotError"></div><div class="success" id="forgotSuccess"></div><div class="input-group"><div class="input-label">Your Email</div><input class="input" id="forgotEmail" type="email" placeholder="you@example.com"></div><button class="btn" onclick="sendReset()">Send Reset Link</button><button class="btn" style="background:rgba(18,18,26,0.5);border:1px solid #2a2a3a;color:#888;margin-top:10px" onclick="closeForgot()">Cancel</button></div></div><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAXtzsTkbgfsaiKzmlEwdDGqIpbzP4FsHQ", authDomain: "cinemora-ai-14d81.firebaseapp.com", projectId: "cinemora-ai-14d81" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
onAuthStateChanged(auth,(u)=>{ if(u) window.location.href='./index.html'; });
window.switchTab=(tab)=>{ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.querySelectorAll('.form-section').forEach(f=>f.classList.remove('active')); if(tab==='login'){ document.getElementById('loginTab').classList.add('active'); document.getElementById('loginForm').classList.add('active'); } else{ document.getElementById('signupTab').classList.add('active'); document.getElementById('signupForm').classList.add('active'); } };
window.checkStrength=(pwd)=>{ const bar=document.getElementById('strengthBar'); const fill=document.getElementById('strengthFill'); const txt=document.getElementById('strengthText'); if(!pwd){ bar.classList.remove('show'); return; } bar.classList.add('show'); let score=0; if(pwd.length>=8) score++; if(/[A-Z]/.test(pwd)) score++; if(/[0-9]/.test(pwd)) score++; if(/[^A-Za-z0-9]/.test(pwd)) score++; const widths=['25%','50%','75%','100%']; const colors=['#ef4444','#f59e0b','#22c55e','#7c3aed']; const labels=['Weak','Fair','Good','Excellent']; fill.style.width=widths[score-1]||'25%'; fill.style.background=colors[score-1]||'#ef4444'; txt.textContent=labels[score-1]||'Too short'; txt.style.color=colors[score-1]||'#ef4444'; };
function showError(m){ const el=document.getElementById('error'); el.style.display='block'; el.textContent=m; document.getElementById('success').style.display='none'; }
function showSuccess(m){ const el=document.getElementById('success'); el.style.display='block'; el.textContent=m; document.getElementById('error').style.display='none'; }
window.openForgot=()=>{ const cur=document.getElementById('loginEmail').value; if(cur) document.getElementById('forgotEmail').value=cur; document.getElementById('forgotModal').classList.add('show'); };
window.closeForgot=()=>{ document.getElementById('forgotModal').classList.remove('show'); };
document.getElementById('loginBtn').addEventListener('click',async()=>{ const e=document.getElementById('loginEmail').value.trim(); const p=document.getElementById('loginPassword').value; if(!e||!p){ showError('Please enter email and password'); return; } try{ await signInWithEmailAndPassword(auth,e,p); location.href='./index.html'; }catch(err){ showError(err.message); } });
document.getElementById('createBtn').addEventListener('click',async()=>{ const name=document.getElementById('signupName').value.trim(); const email=document.getElementById('signupEmail').value.trim(); const pwd=document.getElementById('signupPassword').value; const confirm=document.getElementById('signupConfirm').value; const terms=document.getElementById('termsBox').classList.contains('checked'); if(!name||name.length<3){ showError('Please enter your full name'); return; } if(!email){ showError('Please enter a valid email'); return; } if(pwd.length<8){ showError('Password must be at least 8 characters'); return; } if(pwd!==confirm){ showError('Passwords do not match'); return; } if(!terms){ showError('Please agree to Terms and Privacy Policy'); return; } if(!/[A-Z]/.test(pwd)||!/[0-9]/.test(pwd)){ showError('Password must include uppercase letter and number'); return; } try{ const cred=await createUserWithEmailAndPassword(auth,email,pwd); await updateProfile(cred.user,{displayName:name}); await setDoc(doc(db,'users',cred.user.uid),{fullName:name,email:email,credits:850,created:new Date()}); localStorage.setItem('cinemora_credits','850'); showSuccess('Account created! Welcome '+name); setTimeout(()=>{ location.href='./index.html'; },1200); }catch(err){ showError(err.message); } });
window.sendReset=async()=>{ const email=document.getElementById('forgotEmail').value.trim(); const errEl=document.getElementById('forgotError'); const sucEl=document.getElementById('forgotSuccess'); if(!email){ errEl.style.display='block'; errEl.textContent='Please enter your email'; return; } try{ await sendPasswordResetEmail(auth,email); sucEl.style.display='block'; sucEl.textContent='Reset link sent to '+email; errEl.style.display='none'; setTimeout(()=>{closeForgot(); showSuccess('Reset link sent');},2000); }catch(e){ errEl.style.display='block'; errEl.textContent=e.message; } };
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
</script></body></html>
