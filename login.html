<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - CINEMORA AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#050507;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.card{max-width:360px;width:100%;background:#12121a;border:1px solid #1e1e2a;border-radius:20px;padding:24px}
.logo{font-weight:800;font-size:28px;text-align:center;margin-bottom:20px}
.input{width:100%;background:#0c0c12;border:1px solid #1e1e2a;border-radius:10px;padding:12px;color:#fff;margin-bottom:12px}
.btn{width:100%;background:#7c3aed;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:700;margin-bottom:10px}
.btn2{width:100%;background:transparent;border:1px solid #333;color:#aaa;padding:12px;border-radius:10px}
</style></head><body>
<div class="card">
<div class="logo">CINEMORA AI</div>
<input class="input" id="email" type="email" placeholder="Email">
<input class="input" id="pass" type="password" placeholder="Password 6+ chars">
<button class="btn" id="login">Login</button>
<button class="btn2" id="signup">Create Account - Get 850 Credits</button>
<p id="err" style="color:red;font-size:12px;margin-top:10px;text-align:center"></p>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import{getFirestore,doc,setDoc}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAXtzsTkbgfsaiKzmlEwdDGqIpbzP4FsHQ",authDomain:"cinemora-ai-14d81.firebaseapp.com",projectId:"cinemora-ai-14d81",storageBucket:"cinemora-ai-14d81.firebasestorage.app",messagingSenderId:"1032996592948",appId:"1:1032996592948:web:b3d43cc3e6f6b8d60a5961"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
onAuthStateChanged(auth,u=>{if(u)location.href="index.html"});
document.getElementById('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,email.value,pass.value);location.href="index.html"}catch(e){err.textContent=e.message}};
document.getElementById('signup').onclick=async()=>{try{let c=await createUserWithEmailAndPassword(auth,email.value,pass.value);await setDoc(doc(db,"users",c.user.uid),{email:email.value,credits:850});location.href="index.html"}catch(e){err.textContent=e.message}};
</script></body></html>
